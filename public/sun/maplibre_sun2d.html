      const map1 = new maplibregl.Map({

        // 		style: {

        // 			sky: {}

      const layerIDs = [] // Will contain a list used to filter against.

      let selectedId

      // 方法类别映射: class4值 -> class1缩写
      // 支持中文别名、英文缩写、数字输入，以及模糊匹配
      const methodAliases = {
        EE: {
          class4: ['1'],
          names: ['专家评价', 'Expert Evaluation', 'EE', 'ee', '1', '专家', '评价'],
        },
        MS: {
          class4: ['2'],
          names: ['数学统计', 'Mathematical Statistics', 'MS', 'ms', 'Ms', '2', '数学', '统计'],
        },
        MM: { class4: ['3'], names: ['机器学习模型', 'MM', 'mm', 'Mm', '3', '模型'] },
        ML: {
          class4: ['4'],
          names: ['机器学习', 'Machine Learning', 'ML', 'ml', 'Ml', '4', '机器'],
        },
        HM: {
          class4: ['5', '6'],
          names: ['启发式方法', 'Heuristic Method', 'HM', 'hm', 'Hm', '5', '6', '启发', '启发式'],
        },
      }

      // 方法查询: 将用户输入转换为 class4 值列表，支持模糊匹配
      function getMethodClass4Values(input) {
        const value = input.trim()
        if (!value) return null // 无输入时不筛选
        const words = value.split(/[,，\s]+/).filter((w) => w.length > 0)
        const class4Set = new Set()

        for (const word of words) {
          for (const [, info] of Object.entries(methodAliases)) {
            // 精确匹配或包含匹配
            const matched = info.names.some(
              (name) =>
                name.toLowerCase() === word.toLowerCase() || // 精确匹配
                (name.length >= 2 && word.length >= 2 && name.includes(word)), // 模糊匹配: 输入是别名的子串
            )
            if (matched) {
              info.class4.forEach((v) => class4Set.add(v))
              break // 匹配到一个类别即可，避免重复
            }
          }
        }
        return class4Set.size > 0 ? Array.from(class4Set) : null
      }

      // 统一筛选函数: 组合三个筛选条件
      let factorLocs = null // 因子筛选结果: Set<loc> 或 null(未筛选)

      // 查询 Neo4j 获取包含指定因子的 LOC 列表
      async function getFactorLocs(terms) {
        if (!terms || terms.trim() === '') return null
        const neo4j = window.neo4j
        if (!neo4j) {
          console.warn('neo4j driver not loaded')
          return null
        }

        const driver = neo4j.driver('bolt://localhost:7687', neo4j.auth.basic('neo4j', '21151211'))
        const session = driver.session()
        try {
          // 将用户输入拆分为搜索词列表
          const searchTerms = terms
            .split(/[,，]+/)
            .map((s) => s.trim())
            .filter(Boolean)
          const query = `
            MATCH (i:INF)-[]-(p:PaperID)-[]-(f:FAC)
            WHERE i.loc IS NOT NULL
              AND f.content IS NOT NULL
              AND ANY(term IN $terms WHERE toLower(toString(f.content)) CONTAINS toLower(term))
            RETURN DISTINCT i.loc AS Location
            ORDER BY Location
          `
          const result = await session.run(query, { terms: searchTerms })
          const locSet = new Set()
          result.records.forEach((record) => {
            const loc = record.get('Location')
            if (loc) locSet.add(loc)
          })
          console.log(`因子查询: "${terms}" 匹配到 ${locSet.size} 个区域`)
          return locSet.size > 0 ? locSet : new Set() // 空Set表示无匹配, null表示未筛选
        } catch (err) {
          console.error('因子查询失败:', err)
          return null
        } finally {
          await session.close()
          await driver.close()
        }
      }

      // 筛选结果提示

      let toastTimer = null

        filterToast.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => {

        }, 3000)
      }

      function applyFilters() {
        const regionValue = filterInputRegion.value.trim().toLowerCase()
        const regionWords = regionValue ? regionValue.split(/\s+/) : []
        const methodClass4Values = getMethodClass4Values(filterInputMethod.value)

        // 图层尚未创建时跳过
        if (layerIDs.length === 0) return

        layerIDs.forEach((layerID) => {
          // 从 layerID 中提取 LOC 名称: "poi-{LOC}" -> LOC

          // 1. 区域筛选 (基于 LOC 字段，layerID 格式为 poi-{LOC})
          let regionMatch = true
          if (regionWords.length > 0) {

          }

      //从neo4j读取图谱数据
      async function getCypherResult(limit_items = 100, name = null) {
        const start = new Date()
        const neo4j = window.neo4j
        const driver = neo4j.driver('bolt://localhost:7687', neo4j.auth.basic('neo4j', '21151211'))
        const session = driver.session()
        let query

        // try {
        //   if (name == null) {
        //     query = `
        //     MATCH p=(n)-[r:use_of]->(m)
        //     RETURN n, r, m
        //     LIMIT $limit
        //   `
        //   } else {
        //     query = `
        //       MATCH p=(n:INF{loc:$name})-[r]->(m)
        //       RETURN n, r, m
        //       LIMIT $limit
        //     `
        //   }
        try {
          let query

          if (name == null) {
            query = `
                  MATCH (n)-[r:use_of]->(m)
                  RETURN n, r, m
                  LIMIT $limit
                `
          } else {
            //         query = `
            //   MATCH (n:INF)
            //   WHERE n.loc = $name

            //   OPTIONAL MATCH (n)-[r_fac]-(fac:FAC)
            //   OPTIONAL MATCH (n)-[r_mod]-(mod:MOD)
            //   OPTIONAL MATCH (n)-[r_coord]-(coord:Coordinate)
            //   OPTIONAL MATCH (n)-[r_paper]-(paper:PaperID)
            //   OPTIONAL MATCH (paper)-[r_title]-(title:Title)
            //   OPTIONAL MATCH (paper)-[r_dat]-(dat:DAT)

            //   RETURN n, r_fac, fac, r_mod, mod, r_coord, coord, r_paper, paper, r_title, title, r_dat, dat
            // `
            query = `
                              MATCH (n:INF)
                          WHERE n.loc = $name

                          OPTIONAL MATCH (n)-[r_fac]-(fac:FAC)
                          OPTIONAL MATCH (n)-[r_mod]-(mod:MOD)
                          OPTIONAL MATCH (n)-[r_coord]-(coord:Coordinate)

                          OPTIONAL MATCH (n)-[r_paper]-(paper:PaperID)

                          OPTIONAL MATCH (paper)-[r_title]-(title:Title)
                          OPTIONAL MATCH (paper)-[r_link]-(link:Link)
                          OPTIONAL MATCH (paper)-[r_dat]-(dat:DAT)

                          OPTIONAL MATCH (fac)-[r_fac_dat]-(dat)

                          OPTIONAL MATCH (mod)-[r_mod_dat]-(dat)

                          RETURN
                              n,
                              r_fac, fac,
                              r_mod, mod,
                              r_coord, coord,
                              r_paper, paper,
                              r_title, title,
                              r_link, link,
                              r_dat, dat,
                              r_fac_dat,
                              r_mod_dat
                              `
          }

          const result = await session.run(query, { name: name, limit: neo4j.int(limit_items) })

          const nodes = new Map()
          const links = []

          result.records.forEach((record) => {
            for (const key of record.keys) {
              const item = record.get(key)

              if (!item || !item.identity) continue

              if (item.labels) {
                // 节点处理
                const nodeId = item.identity.toNumber()
                if (!nodes.has(nodeId)) {
                  nodes.set(nodeId, {
                    id: nodeId,
                    elementId: item.elementId,
                    labels: item.labels,
                    properties_ID: item.properties?.ID,
                    name:
                      item.properties?.loc ||
                      item.properties?.content ||
                      item.properties?.value ||
                      item.properties?.text ||
                      item.properties?.url ||
                      item.properties?.id,
                    properties: item.properties,
                    color: getNodeColor(item.labels),
                  })
                }
              } else if (item.type) {
                // 关系处理
                links.push({
                  source: item.start.toNumber(),
                  target: item.end.toNumber(),
                  id: item.identity.toNumber(),
                  elementId: item.elementId,
                  properties: item.type,
                })
              }
            }
          })

          const graphData = {
            nodes: Array.from(nodes.values()),
            links,
          }

          loadGraph(graphData)
        } finally {
          await Promise.all([session.close(), driver.close()])
        }
      }

            // maintain label vertical orientation for legibility
            if (textAngle > Math.PI / 2) textAngle = -(Math.PI - textAngle)
